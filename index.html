<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wifi Squared — Fast. Reliable. Local Internet.</title>
<meta name="description" content="Wifi Squared is a local fixed-wireless ISP serving Wears Valley, Little Cove, Waldens Creek, and the foothills of the Great Smoky Mountains since 2013. No contracts. No data caps.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#16404F;
    --navy-deep:#0C2C38;
    --navy-ink:#103543;
    --sun:#F7941D;
    --ember:#E85D2A;
    --comet:#6E97A8;
    --cream:#FBF9F5;
    --mist:#EAF1F3;
    --line:#D3E0E4;
    --text:#27404B;
    --white:#FFFFFF;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *,*::before,*::after{animation:none!important;transition:none!important;}
  }
  body{
    font-family:'Public Sans',system-ui,sans-serif;
    color:var(--text);
    background:var(--cream);
    line-height:1.6;
    font-size:17px;
  }
  h1,h2,h3{font-family:'Fraunces',serif;color:var(--navy-ink);line-height:1.15;}
  a{color:var(--ember);}
  img{max-width:100%;}
  .wrap{max-width:1120px;margin:0 auto;padding:0 24px;}

  header{
    position:sticky;top:0;z-index:50;
    background:rgba(14,35,71,.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  .nav{display:flex;align-items:center;justify-content:space-between;height:68px;}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;}
  .brand svg{height:38px;width:auto;}
  .brand-name{font-family:'Fraunces',serif;font-weight:900;font-size:1.15rem;color:#fff;letter-spacing:.02em;line-height:1;}
  .brand-name span{display:block;font-family:'Public Sans',sans-serif;font-weight:600;font-size:.58rem;letter-spacing:.28em;color:var(--sun);text-transform:uppercase;margin-top:3px;}
  nav.links{display:flex;align-items:center;gap:26px;}
  nav.links a{color:#E3EDF0;text-decoration:none;font-size:.92rem;font-weight:500;}
  nav.links a:hover{color:var(--sun);}
  .btn{
    display:inline-block;background:var(--sun);color:var(--navy-deep);
    font-weight:700;text-decoration:none;border-radius:8px;
    padding:11px 22px;font-size:.95rem;border:none;cursor:pointer;
    transition:transform .15s ease, background .15s ease;
  }
  .btn:hover{background:#FFA63A;transform:translateY(-1px);}
  .btn:focus-visible, a:focus-visible{outline:3px solid var(--sun);outline-offset:2px;}
  .btn
